name: desktop

on:
  push:
    branches: [desktop, main]
    paths:
      - 'desktop/**'
      - 'internal/app/**'
      - 'internal/httpapi/**'
      # Decides what the Linux artifact and the release zip contain, so a
      # change to it has to be built to be checked.
      - 'scripts/package-linux.sh'

permissions:
  contents: read

jobs:
  build:
    name: wails build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # wails v2.15.0 declares `go 1.25.0`, so the module's go directive is
          # 1.25.0 and an older toolchain refuses to build it.
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      # Ubuntu 24.04 (ubuntu-latest) dropped libwebkit2gtk-4.0-dev. Wails v2
      # builds against 4.1 only with the webkit2_41 build tag.
      - name: Install WebKitGTK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      # ci.yml's ubuntu `test` job skips ./desktop because it has no cgo
      # and no WebKitGTK; this job has both, so it is the only place the
      # bridge's tests run on Linux at all. (They also run on the Windows
      # job in ci.yml, and nowhere on macOS.)
      - name: Test the bridge (Linux)
        if: runner.os == 'Linux'
        run: go test -tags webkit2_41 ./desktop/

      - name: Build (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop
        run: wails build -tags webkit2_41

      - name: Build (macOS and Windows)
        if: runner.os != 'Linux'
        working-directory: desktop
        run: wails build

      # `wails build` leaves a bare executable on Linux, which is not
      # something a person can install. This puts the launcher entry, the
      # icon and install.sh beside it, so the artifact downloaded from a
      # branch is the same shape as the release zip.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/package-linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: sirdar-desktop-${{ matrix.os }}
          path: desktop/build/bin/*
          if-no-files-found: error
