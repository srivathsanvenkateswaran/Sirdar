name: desktop

on:
  push:
    branches: [desktop, main]
    paths: ['desktop/**', 'internal/app/**', 'internal/httpapi/**']

permissions:
  contents: read

jobs:
  build:
    name: wails build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # wails v2.15.0 declares `go 1.25.0`, so the module's go directive is
          # 1.25.0 and an older toolchain refuses to build it.
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      # Ubuntu 24.04 (ubuntu-latest) dropped libwebkit2gtk-4.0-dev. Wails v2
      # builds against 4.1 only with the webkit2_41 build tag.
      - name: Install WebKitGTK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop
        run: wails build -tags webkit2_41

      - name: Build (macOS and Windows)
        if: runner.os != 'Linux'
        working-directory: desktop
        run: wails build

      - uses: actions/upload-artifact@v7
        with:
          name: sirdar-desktop-${{ matrix.os }}
          path: desktop/build/bin/*
          if-no-files-found: error
