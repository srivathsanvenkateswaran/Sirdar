name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with: { go-version: '1.26' }
      # `desktop` needs cgo + WebKitGTK; the desktop workflow builds it on all
      # three platforms, so keep this job to the pure-Go packages.
      - run: go vet $(go list ./... | grep -v '/desktop$')
      - run: go test $(go list ./... | grep -v '/desktop$')

  # The shared frontend is the same bundle both shells load, and neither Go
  # job compiles a line of it, so it is checked on its own.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
