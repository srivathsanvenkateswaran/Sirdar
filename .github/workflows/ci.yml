name: ci
on:
  push:
  pull_request:
  # So a platform round can re-run this on its own branch without an empty
  # commit: `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      # `desktop` needs cgo + WebKitGTK; the desktop workflow builds it on all
      # three platforms, so keep this job to the pure-Go packages.
      - run: go vet $(go list ./... | grep -v '/desktop$')
      - run: go test $(go list ./... | grep -v '/desktop$')

  # macOS and Windows run the same Go packages the Linux job does. They are
  # separate jobs rather than a matrix on `test` because each needs its own
  # shell for the package list, and because the Windows one also builds the
  # desktop app: Wails cross-compiles windows/amd64 from any machine, but
  # only a Windows runner can compile it natively and only there does the
  # result get exercised by the platform it targets.
  #
  # What these jobs cover that a macOS laptop cannot: the Windows halves of
  # internal/osopen, internal/procgroup (taskkill), internal/agenttools
  # (cmd /C) and internal/config's Credential Manager reader.
  #
  # A test that needs an external program stands one up with
  # internal/testbin — a hard link to the running test binary, dispatched
  # by the name it was installed under — rather than a #!/bin/sh script,
  # so the MCP, serve, runs and transcription paths are exercised here and
  # not skipped. What still skips itself on Windows, saying so in the log,
  # is the handful of assertions about facilities the platform does not
  # have: Unix mode bits, a POSIX user database, symlinks.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - run: go build $(go list ./... | grep -v '/desktop$')
      - run: go vet $(go list ./... | grep -v '/desktop$')
      - run: go test $(go list ./... | grep -v '/desktop$')

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      # Unlike the Linux job, this one keeps ./desktop in: Wails needs no
      # cgo and no WebKitGTK on Windows, and the bridge's OpenConfig and
      # OpenNote are two of the call sites this platform changes. The
      # committed desktop/frontend/dist/.gitkeep is what the embed directive
      # matches before the frontend has been built.
      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # The .exe is the artifact this job exists to produce, and a failing
      # test is the most likely reason someone wants to download it and
      # look. Both steps therefore run whatever `go test` did; the job
      # still fails, because `go test` already failed it.
      - name: Install wails CLI
        if: always()
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: wails build
        if: always()
        working-directory: desktop
        run: wails build -platform windows/amd64

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sirdar-desktop-windows-amd64
          path: desktop/build/bin/Sirdar.exe
          if-no-files-found: error

  # The shared frontend is the same bundle both shells load, and neither Go
  # job compiles a line of it, so it is checked on its own.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
