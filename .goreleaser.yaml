version: 2

project_name: sirdar

before:
  hooks:
    - go mod tidy

builds:
  - id: sirdar
    main: ./cmd/sirdar
    binary: sirdar
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: sirdar
    name_template: "sirdar_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]

checksum:
  name_template: "checksums.txt"

changelog:
  use: git
  sort: asc

release:
  draft: true
