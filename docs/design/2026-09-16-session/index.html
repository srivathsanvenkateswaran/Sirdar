<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sirdar · the Session window, three directions</title>
<style>
:root{--paper:#F2EEE0;--sheet:#FFFDF7;--ink:#17181C;--ink2:#4A4E58;--ink3:#676B74;--rule:#E3DFD1;--hi:#E4E0FF;--acc:#3B3AA6}
html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:15px/1.5 Figtree,Inter,-apple-system,system-ui,sans-serif;overflow:hidden}
header{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--rule);background:var(--sheet)}
header h1{margin:0;font:400 20px Newsreader,Georgia,serif;flex:1}
.seg{display:inline-flex;padding:3px;border:1px solid var(--rule);border-radius:999px;background:var(--paper)}
.seg button{border:0;background:transparent;padding:5px 14px;border-radius:999px;font:inherit;color:var(--ink2);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--sheet);box-shadow:0 0 0 1px #C9C4B2;color:var(--ink);font-weight:500}
.k{display:inline-block;min-width:22px;padding:0 6px;border-radius:6px;background:var(--hi);font-weight:600;text-align:center;margin-right:6px}
main{flex:1;display:grid;grid-template-columns:1fr 340px;min-height:0}
.stage{position:relative;display:flex;align-items:center;justify-content:center;padding:20px 64px;min-width:0}
.stage img{max-width:100%;max-height:100%;aspect-ratio:1470/900;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);display:block;cursor:zoom-in}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:999px;border:1px solid #C9C4B2;background:var(--sheet);color:var(--ink);font-size:20px;cursor:pointer}
.nav:hover{border-color:var(--acc)}.nav.prev{left:10px}.nav.next{right:10px}
aside{border-left:1px solid var(--rule);background:var(--sheet);padding:20px 24px;overflow:auto}
aside h2{margin:0 0 4px;font-size:18px;font-weight:500}aside .scene{color:var(--ink3);margin:0 0 14px;font-size:13px}
aside p{margin:0 0 12px;color:var(--ink2);white-space:pre-line}
aside a{color:var(--acc)}
.links{display:flex;gap:10px;margin:8px 0 18px;flex-wrap:wrap}
.links a{display:inline-block;padding:6px 12px;border:1px solid #C9C4B2;border-radius:8px;text-decoration:none;color:var(--ink);font-size:13px;background:var(--paper)}
footer{border-top:1px solid var(--rule);background:var(--sheet);padding:10px 24px;display:flex;gap:10px;align-items:center;overflow-x:auto}
footer .thumb{flex:0 0 auto;width:132px;border:2px solid transparent;border-radius:8px;padding:0;background:none;cursor:pointer}
footer .thumb img{width:100%;aspect-ratio:1470/900;border-radius:6px;display:block;border:1px solid var(--rule)}
footer .thumb span{display:block;font-size:11px;color:var(--ink3);margin-top:3px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer .thumb[aria-current=true]{border-color:var(--acc)}
.count{margin-left:auto;font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:12px;color:var(--ink3);white-space:nowrap}
.hint{font-size:12px;color:var(--ink3)}
</style></head><body>
<header><h1>The Session window, three directions</h1>
<div class="seg" id="dirs"></div>
<span class="hint">← → scenes · ↑ ↓ directions · Enter opens the page</span></header>
<main><div class="stage"><button class="nav prev" aria-label="Previous scene">‹</button><a id="link" target="_blank"><img id="shot" alt=""></a><button class="nav next" aria-label="Next scene">›</button></div>
<aside><h2 id="title"></h2><p class="scene" id="scene"></p><div class="links"><a id="open" target="_blank">Open the page at full size</a><a id="readme" target="_blank">Designer's README</a></div><p id="intro"></p></aside></main>
<footer id="strip"><span class="count" id="count"></span></footer>
<script>
const D={"slides": [{"dir": "A", "name": "Conversation first", "key": "S1-Triage", "label": "Triage run, opened fresh", "page": "A/A-S1-Triage.html", "shot": "shots/A-S1-Triage.png"}, {"dir": "A", "name": "Conversation first", "key": "S2-Blocked", "label": "Fix run, blocked on a question", "page": "A/A-S2-Blocked.html", "shot": "shots/A-S2-Blocked.png"}, {"dir": "A", "name": "Conversation first", "key": "S3-Expanded", "label": "A tool call expanded", "page": "A/A-S3-Expanded.html", "shot": "shots/A-S3-Expanded.png"}, {"dir": "A", "name": "Conversation first", "key": "S4-Pane", "label": "Bundle: ticket and thread", "page": "A/A-S4-Pane.html", "shot": "shots/A-S4-Pane.png"}, {"dir": "A", "name": "Conversation first", "key": "S5-Tools", "label": "Tools view", "page": "A/A-S5-Tools.html", "shot": "shots/A-S5-Tools.png"}, {"dir": "A", "name": "Conversation first", "key": "S6-Changes", "label": "Change review", "page": "A/A-S6-Changes.html", "shot": "shots/A-S6-Changes.png"}, {"dir": "B", "name": "The note is the work", "key": "S1-Triage", "label": "Triage run, opened fresh", "page": "B/B-S1-Triage.html", "shot": "shots/B-S1-Triage.png"}, {"dir": "B", "name": "The note is the work", "key": "S2-Blocked", "label": "Fix run, blocked on a question", "page": "B/B-S2-Blocked.html", "shot": "shots/B-S2-Blocked.png"}, {"dir": "B", "name": "The note is the work", "key": "S3-Expanded", "label": "A tool call expanded", "page": "B/B-S3-Expanded.html", "shot": "shots/B-S3-Expanded.png"}, {"dir": "B", "name": "The note is the work", "key": "S4-Pane", "label": "Bundle: ticket and thread", "page": "B/B-S4-Pane.html", "shot": "shots/B-S4-Pane.png"}, {"dir": "B", "name": "The note is the work", "key": "S5-Tools", "label": "Tools view", "page": "B/B-S5-Tools.html", "shot": "shots/B-S5-Tools.png"}, {"dir": "B", "name": "The note is the work", "key": "S6-Changes", "label": "Change review", "page": "B/B-S6-Changes.html", "shot": "shots/B-S6-Changes.png"}, {"dir": "C", "name": "Workbench", "key": "S1-Triage", "label": "Triage run, opened fresh", "page": "C/C-S1-Triage.html", "shot": "shots/C-S1-Triage.png"}, {"dir": "C", "name": "Workbench", "key": "S2-Blocked", "label": "Fix run, blocked on a question", "page": "C/C-S2-Blocked.html", "shot": "shots/C-S2-Blocked.png"}, {"dir": "C", "name": "Workbench", "key": "S3-Expanded", "label": "A tool call expanded", "page": "C/C-S3-Expanded.html", "shot": "shots/C-S3-Expanded.png"}, {"dir": "C", "name": "Workbench", "key": "S4-Pane", "label": "Bundle: ticket and thread", "page": "C/C-S4-Pane.html", "shot": "shots/C-S4-Pane.png"}, {"dir": "C", "name": "Workbench", "key": "S5-Tools", "label": "Tools view", "page": "C/C-S5-Tools.html", "shot": "shots/C-S5-Tools.png"}, {"dir": "C", "name": "Workbench", "key": "S6-Changes", "label": "Change review", "page": "C/C-S6-Changes.html", "shot": "shots/C-S6-Changes.png"}], "intro": {"A": "Open any `A-S*.html` in a browser at 1470×900 (the pages set the viewport). Every string comes from the SBX-1 runs\n`20260915T121105Z-076d` (triage) and `20260915T121451Z-bf19` (fix), their bundle, and the triage note; trimmed where a\nsentence ran long, never rewritten. Sources: `sirdar-mocks/A-session.css`, `A-assemble.py` (fragments), `A-s1..6.body.html`.", "B": "## The idea", "C": "Six artboards, 1470×900, built from `C-session.css` + `C-s1..6.body.html` (generated by `C-gen.py` from the real runs) with `build.sh`, exported with `mkpage.sh`. Open the `.html` files in this folder."}, "boards": ["S1-Triage", "S2-Blocked", "S3-Expanded", "S4-Pane", "S5-Tools", "S6-Changes"]};let dir='A',scene=0;
const byKey=(d,k)=>D.slides.find(s=>s.dir===d&&s.key===k);
function render(){const s=byKey(dir,D.boards[scene]);shot.src=s.shot;shot.alt=s.dir+' '+s.label;link.href=s.page;open.href=s.page;readme.href=s.dir+'/README.md';title.innerHTML='<span class="k">'+s.dir+'</span>'+s.name;scene_.textContent='Scene '+(scene+1)+' of '+D.boards.length+' · '+s.label;intro.textContent=D.intro[s.dir];count.textContent=s.dir+' · '+(scene+1)+'/'+D.boards.length;
 document.querySelectorAll('#dirs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.d===dir));
 document.querySelectorAll('.thumb').forEach(t=>t.setAttribute('aria-current',t.dataset.d===dir&&+t.dataset.i===scene));
 location.hash=dir+'-'+(scene+1);}
const scene_=document.getElementById('scene');
for(const [d,name] of Object.entries({A:'Conversation first',B:'The note is the work',C:'Workbench'})){const b=document.createElement('button');b.dataset.d=d;b.innerHTML='<span class="k">'+d+'</span>'+name;b.onclick=()=>{dir=d;render()};dirs.appendChild(b)}
for(const d of ['A','B','C'])D.boards.forEach((k,i)=>{const s=byKey(d,k);const t=document.createElement('button');t.className='thumb';t.dataset.d=d;t.dataset.i=i;t.innerHTML='<img src="'+s.shot+'" alt=""><span>'+d+' · '+s.label+'</span>';t.onclick=()=>{dir=d;scene=i;render()};strip.insertBefore(t,count)});
document.querySelector('.prev').onclick=()=>{scene=(scene+D.boards.length-1)%D.boards.length;render()};
document.querySelector('.next').onclick=()=>{scene=(scene+1)%D.boards.length;render()};
addEventListener('keydown',e=>{if(e.key==='ArrowRight'){scene=(scene+1)%D.boards.length;render()}else if(e.key==='ArrowLeft'){scene=(scene+D.boards.length-1)%D.boards.length;render()}else if(e.key==='ArrowDown'){dir=({A:'B',B:'C',C:'A'})[dir];render()}else if(e.key==='ArrowUp'){dir=({A:'C',B:'A',C:'B'})[dir];render()}else if(e.key==='Enter'){window.open(link.href,'_blank')}});
const m=location.hash.match(/^#([ABC])-(\d)$/);if(m){dir=m[1];scene=Math.min(D.boards.length,+m[2])-1}
render();
</script></body></html>
